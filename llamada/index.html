<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Llamada entrante · Lobo de Lujo</title>
  <meta name="description" content="El lobo te está llamando 📞">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0c">
  <meta property="og:title" content="📞 Llamada entrante · Lobo de Lujo">
  <meta property="og:description" content="El lobo te está llamando. ¿Contestas?">
  <meta property="og:image" content="https://lobodelujo.cl/img/compartir.jpg?v=2">
  <link rel="icon" type="image/png" href="/img/logo-lobo-128.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --negro: #0b0b0c; --oro: #fad02c; --texto: #f4f1ea; --suave: #b9b5ad; --rojo: #e2483d; --verde: #23c55e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html, body { height: 100%; background: var(--negro); color: var(--texto); font-family: "Inter", system-ui, sans-serif; overflow: hidden; }
    .capa { position: fixed; inset: 0; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

    /* 1 · Llamada entrante */
    #llamada::after { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(11,11,12,.75) 0%, rgba(11,11,12,.1) 30%, rgba(11,11,12,.15) 55%, rgba(11,11,12,.88) 100%); }
    .arriba { position: absolute; z-index: 2; top: max(28px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; padding: 0 20px; }
    .tipo { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--suave); }
    .nombre { font-family: "Bebas Neue", Impact, sans-serif; font-size: clamp(44px, 13vw, 64px); letter-spacing: 3px; line-height: 1; margin-top: 10px; }
    .nombre .oro { color: var(--oro); }
    .estado { margin-top: 8px; font-size: 15px; color: var(--oro); }
    .estado i { display: inline-block; animation: puntos 1.4s infinite; font-style: normal; }
    .estado i:nth-child(2) { animation-delay: .2s; } .estado i:nth-child(3) { animation-delay: .4s; }
    @keyframes puntos { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
    .abajo { position: absolute; z-index: 2; left: 0; right: 0; bottom: max(40px, env(safe-area-inset-bottom)); display: flex; justify-content: space-around; padding: 0 12%; }
    .boton { display: grid; justify-items: center; align-content: start; gap: 10px; text-align: center; max-width: 150px; background: none; border: 0; color: var(--texto); font: 500 15px "Inter", sans-serif; cursor: pointer; }
    .circulo { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; position: relative; }
    .circulo svg { width: 34px; height: 34px; fill: #fff; }
    .rechazar .circulo { background: var(--rojo); }
    .rechazar svg { transform: rotate(135deg); }
    .aceptar .circulo { background: var(--verde); animation: latido 1.2s ease-in-out infinite; }
    .aceptar .circulo::before, .aceptar .circulo::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--verde); animation: onda 1.6s ease-out infinite; }
    .aceptar .circulo::after { animation-delay: .8s; }
    @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes onda { from { transform: scale(1); opacity: .8; } to { transform: scale(1.9); opacity: 0; } }
    .boton:active .circulo { transform: scale(.92); }
    .no-acepta { position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(86%, 360px); text-align: center;
      background: rgba(11,11,12,.85); border: 1px solid var(--oro); border-radius: 18px; padding: 22px 18px; font-size: 18px; font-weight: 600; }
    .no-acepta b { display: block; font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: 34px; letter-spacing: 1px; color: var(--oro); }

    /* 2 · El video al contestar */
    #contesta { background: #000; }
    /* Parte 2 cargada detrás (sin reproducirse); se muestra recién cuando ya está sonando */
    #v-contesta2 { opacity: 0; }
    #contesta.parte2 #v-contesta { opacity: 0; }
    #contesta.parte2 #v-contesta2 { opacity: 1; }
    .saltar { position: absolute; z-index: 2; right: 16px; top: max(18px, env(safe-area-inset-top)); padding: 8px 14px; border-radius: 999px; border: 0;
      background: rgba(11,11,12,.6); color: var(--texto); font: 600 13px "Inter", sans-serif; cursor: pointer; }
    .sonido { position: absolute; z-index: 2; left: 16px; top: max(18px, env(safe-area-inset-top)); padding: 8px 14px; border-radius: 999px; border: 0;
      background: rgba(11,11,12,.6); color: var(--texto); font: 600 13px "Inter", sans-serif; cursor: pointer; }

    /* 3 · Llamada finalizada */
    #fin { display: grid; place-items: center; text-align: center; padding: 24px;
      background: radial-gradient(circle at 50% 38%, rgba(250,208,44,.22), transparent 55%), var(--negro); }
    .fin-caja { width: min(100%, 380px); display: grid; justify-items: center; gap: 10px; }
    .fin-tipo { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--suave); }
    .fin-tiempo { font-size: 17px; color: var(--suave); }
    .fin-logo { width: 110px; height: auto; margin: 18px 0 4px; filter: drop-shadow(0 8px 26px rgba(250,208,44,.35)); }
    .fin-nombre { font-family: "Bebas Neue", Impact, sans-serif; font-size: 48px; letter-spacing: 3px; line-height: 1; }
    .fin-frase { color: var(--oro); font-size: 13px; letter-spacing: 3px; text-transform: uppercase; }
    .fin-boton { margin-top: 22px; display: inline-block; padding: 16px 30px; border-radius: 999px; background: var(--oro); color: var(--negro);
      font-weight: 700; font-size: 16px; text-decoration: none; box-shadow: 0 10px 30px rgba(250,208,44,.3); }
    .fin-web { margin-top: 6px; color: var(--suave); font-size: 14px; }
    .fin-repetir { margin-top: 14px; background: none; border: 0; color: var(--suave); text-decoration: underline; font: 500 13px "Inter", sans-serif; cursor: pointer; }
    .aparece > * { opacity: 0; transform: translateY(12px); animation: sube .6s forwards; }
    .aparece > *:nth-child(2) { animation-delay: .15s; } .aparece > *:nth-child(3) { animation-delay: .5s; } .aparece > *:nth-child(4) { animation-delay: .65s; }
    .aparece > *:nth-child(5) { animation-delay: .8s; } .aparece > *:nth-child(6) { animation-delay: 1.1s; } .aparece > *:nth-child(7) { animation-delay: 1.2s; } .aparece > *:nth-child(8) { animation-delay: 1.4s; }
    @keyframes sube { to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <!-- 1 · Llamada entrante: el lobo llamando (video en bucle, sin sonido) -->
  <section class="capa" id="llamada">
    <video id="v-llamada" autoplay muted loop playsinline preload="auto"></video>
    <div class="arriba">
      <p class="tipo">Videollamada entrante</p>
      <h1 class="nombre">LOBO TE ESTÁ<br><span class="oro">LLAMANDO</span></h1>
      <p class="estado">Llamando<i>.</i><i>.</i><i>.</i></p>
    </div>
    <div class="abajo">
      <button class="boton rechazar" id="rechazar" aria-label="Rechazar la llamada">
        <span class="circulo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg></span>
        Rechazar
      </button>
      <button class="boton aceptar" id="aceptar" aria-label="Aceptar videollamada">
        <span class="circulo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg></span>
        Aceptar videollamada
      </button>
    </div>
    <div class="no-acepta" id="no-acepta" hidden><b>El lobo no acepta un no 🐺</b>Te está conectando igual…</div>
  </section>

  <!-- 2 · Al contestar: el video con sonido -->
  <section class="capa" id="contesta" hidden>
    <video id="v-contesta2" playsinline preload="auto"></video>
    <video id="v-contesta" playsinline preload="auto"></video>
    <button class="sonido" id="sonido" hidden>🔊 Activar sonido</button>
    <button class="saltar" id="saltar">Saltar ›</button>
  </section>

  <!-- 3 · Llamada finalizada -->
  <section class="capa" id="fin" hidden>
    <div class="fin-caja" id="fin-caja">
      <p class="fin-tipo">Llamada finalizada</p>
      <p class="fin-tiempo" id="fin-tiempo">00:00</p>
      <img class="fin-logo" src="/img/logo-lobo-256.png" alt="Lobo de Lujo" width="110" height="126">
      <p class="fin-nombre">LOBO DE LUJO</p>
      <p class="fin-frase">Presencia primero que todo</p>
      <a class="fin-boton" href="/">Entrar al catálogo</a>
      <p class="fin-web">lobodelujo.cl</p>
      <button class="fin-repetir" id="repetir">Ver la llamada otra vez</button>
    </div>
  </section>

  <script>
    // ===== Videos de "La llamada del lobo" (2026-11-16) =====
    // VIDEO_LLAMADA: el lobo asomándose detrás de la columna con el celular (toma 7, la misma de la historia), en bucle y sin sonido
    // VIDEO_CONTESTA + VIDEO_CONTESTA_2: el reel completo con la voz del lobo, al aceptar, en 1080p y en 2 partes
    // (cortado en el seg 20,05, un fundido a negro con audio bajo, para que el cambio no se note)
    var VIDEO_LLAMADA = "/llamada/lobo-llamando-3.mp4";
    var VIDEO_CONTESTA = "/llamada/lobo-contesta-1.mp4";
    var VIDEO_CONTESTA_2 = "/llamada/lobo-contesta-2.mp4";
    var POSTER = "/llamada/lobo-poster-3.jpg";

    var $ = function (s) { return document.querySelector(s); };
    // La parte 2 espera cargada en un segundo reproductor, SIN reproducirse (así nunca suenan dos a la vez).
    // Al terminar la 1 parte la 2 al instante y se muestra cuando ya está sonando: el cambio no se nota.
    // Si el teléfono no deja partir la 2 sola, se carga la 2 en el mismo reproductor (respaldo).
    var vLlamada = $("#v-llamada"), vContesta = $("#v-contesta"), vContesta2 = $("#v-contesta2");
    var modo = 1; // 1 = parte 1 · 2 = parte 2 en su reproductor · 3 = parte 2 en el reproductor de la 1 (respaldo)
    vLlamada.poster = POSTER; vLlamada.src = VIDEO_LLAMADA;
    vContesta.src = VIDEO_CONTESTA;
    vContesta2.src = VIDEO_CONTESTA_2;
    var inicio = 0, ctx = null, timbre = null;

    // Sonidos hechos en el navegador (sin archivos): el timbre de llamada y el "tu-tu-tu" al colgar
    function audio() {
      if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    }
    function tono(frecs, desde, dura, vol) {
      var c = audio(); if (!c) return;
      var g = c.createGain(); g.connect(c.destination);
      g.gain.setValueAtTime(0, c.currentTime + desde);
      g.gain.linearRampToValueAtTime(vol, c.currentTime + desde + 0.02);
      g.gain.setValueAtTime(vol, c.currentTime + desde + dura - 0.03);
      g.gain.linearRampToValueAtTime(0, c.currentTime + desde + dura);
      frecs.forEach(function (f) { var o = c.createOscillator(); o.type = "sine"; o.frequency.value = f; o.connect(g); o.start(c.currentTime + desde); o.stop(c.currentTime + desde + dura + 0.05); });
    }
    function sonarTimbre() {
      if (timbre) return;
      var ring = function () { tono([440, 480], 0, 0.4, 0.12); tono([440, 480], 0.6, 0.4, 0.12); };
      ring(); timbre = setInterval(ring, 3000);
    }
    function pararTimbre() { if (timbre) { clearInterval(timbre); timbre = null; } }
    function colgar() { for (var i = 0; i < 3; i++) tono([425], i * 0.45, 0.25, 0.14); }

    // El navegador no deja sonar nada hasta que la persona toca la pantalla: con el primer toque suena el timbre
    document.addEventListener("pointerdown", function primero(e) {
      document.removeEventListener("pointerdown", primero);
      if (!$("#llamada").hidden && !e.target.closest(".boton")) sonarTimbre();
    });

    function contestar() {
      pararTimbre();
      audio();
      $("#llamada").hidden = true;
      $("#contesta").hidden = false;
      inicio = Date.now();
      if (modo === 3) vContesta.src = VIDEO_CONTESTA;
      modo = 1;
      $("#contesta").classList.remove("parte2");
      vContesta2.pause(); vContesta2.currentTime = 0;
      vContesta.currentTime = 0;
      vContesta.muted = false;
      var p = vContesta.play();
      if (p && p.catch) p.catch(function () {
        // Si el teléfono no deja partir con sonido, parte en silencio con un botón para activarlo
        vContesta.muted = true; vContesta.play(); $("#sonido").hidden = false;
      });
    }
    function parte2() {
      modo = 2;
      vContesta2.muted = vContesta.muted;
      var q = vContesta2.play();
      var mostrar = function () { if (modo === 2) $("#contesta").classList.add("parte2"); };
      if (q && q.then) q.then(mostrar).catch(function () {
        // Respaldo: la parte 2 en el mismo reproductor de la 1
        modo = 3;
        vContesta.src = VIDEO_CONTESTA_2;
        var r = vContesta.play();
        if (r && r.catch) r.catch(function () { vContesta.muted = true; vContesta.play(); $("#sonido").hidden = false; });
      });
      else mostrar();
    }
    function terminar() {
      vContesta.pause(); vContesta2.pause();
      var s = Math.max(1, Math.round((Date.now() - inicio) / 1000));
      $("#fin-tiempo").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      $("#contesta").hidden = true;
      $("#fin").hidden = false;
      var caja = $("#fin-caja"); caja.classList.remove("aparece"); void caja.offsetWidth; caja.classList.add("aparece");
      colgar();
    }

    $("#aceptar").addEventListener("click", contestar);
    $("#rechazar").addEventListener("click", function () {
      pararTimbre();
      $("#no-acepta").hidden = false;
      setTimeout(function () { $("#no-acepta").hidden = true; contestar(); }, 1800);
    });
    $("#sonido").addEventListener("click", function () { vContesta.muted = false; vContesta2.muted = false; $("#sonido").hidden = true; });
    $("#saltar").addEventListener("click", terminar);
    vContesta.addEventListener("ended", function () { if (modo === 1) parte2(); else if (modo === 3) terminar(); });
    vContesta2.addEventListener("ended", function () { if (modo === 2) terminar(); });
    $("#repetir").addEventListener("click", function () {
      $("#fin").hidden = true; $("#llamada").hidden = false; vLlamada.play();
    });
  </script>
</body>
</html>
