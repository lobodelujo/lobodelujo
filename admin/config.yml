# Panel de administración de Lobo de Lujo (Decap CMS)
# Lo único que hay que cambiar al configurar: la línea "repo" (tu-usuario/nombre-del-repositorio)

backend:
  name: github
  repo: lobodelujo/lobodelujo
  branch: main
  # El inicio de sesión con GitHub lo hace la propia web en Cloudflare (carpeta functions/api)
  base_url: https://lobodelujo.pages.dev
  auth_endpoint: api/auth
  commit_messages:
    update: "Actualizar {{collection}}: {{slug}}"
    uploadMedia: "Subir foto {{path}}"
    deleteMedia: "Borrar foto {{path}}"

locale: es
logo_url: /img/logo-lobo-256.png
media_folder: img/productos
public_folder: img/productos

collections:
  - name: catalogo
    label: Catálogo
    editor:
      preview: false
    files:
      - name: productos
        label: "🛍️ Productos"
        file: datos/productos.json
        fields:
          - name: productos
            label: Productos
            label_singular: producto
            widget: list
            add_to_top: true
            collapsed: true
            # Lo que va entre ⟪ ⟫ no se ve: admin/index.html lo cambia por la miniatura de la foto de portada
            summary: "{{fields.nombre}} · ${{fields.precio}} · {{fields.categoria}} ⟪{{fields.fotos}}⟫"
            fields:
              - { name: nombre, label: "Nombre del producto", widget: string }
              - name: categoria
                label: Categoría
                widget: select
                # Si agregas una categoría aquí, agrégala también en "Datos de la tienda"
                options: [Poleras, Polerones, Pantalones, Shorts, Gorras, Lentes, Accesorios]
              - { name: precio, label: "Precio (sin puntos ni $)", widget: number, value_type: int, min: 0 }
              - { name: precioAntes, label: "Precio anterior tachado (solo si está en oferta)", widget: number, value_type: int, min: 0, required: false }
              - name: etiqueta
                label: Etiqueta
                widget: select
                required: false
                options: [Nuevo, Oferta, "Últimas unidades"]
              - { name: disponible, label: "¿Hay stock? (apágalo para mostrar AGOTADO)", widget: boolean, default: true }
              - { name: perchero, label: "🐺 Colgar en El Perchero de Lobo (solo salen las que marques)", widget: boolean, default: false, required: false }
              - { name: fotoPercheroLado, label: "🐺 Perchero · foto DE LADO en la percha (prompt PERCHERO · LADO EN LA PERCHA · PNG sin fondo de Canva). Así cuelga en el riel", widget: image, required: false, choose_url: false }
              - { name: fotoPerchero, label: "🐺 Perchero · foto DE FRENTE en la percha (prompt PERCHERO · FRENTE EN LA PERCHA · PNG sin fondo). Se ve al tocarla; si no subes una, se recorta sola de tus fotos", widget: image, required: false, choose_url: false }
              - { name: fotoPercheroEspalda, label: "🐺 Perchero · foto DE ESPALDA en la percha (prompt PERCHERO · ESPALDA EN LA PERCHA · PNG sin fondo, opcional)", widget: image, required: false, choose_url: false }
              - { name: vitrina, label: "💫 Girar en La Vitrina de Lobo (solo salen los que marques)", widget: boolean, default: false, required: false }
              - { name: fotoVitrina, label: "💫 Vitrina · foto SIN FONDO del accesorio solo (prompt VITRINA · ACCESORIO SOLO · PNG sin fondo de Canva). Es la que gira; si no subes una, se intenta recortar sola tu foto 1", widget: image, required: false, choose_url: false }
              - { name: descripcion, label: "Descripción corta", widget: text, required: false }
              - name: tallas
                label: Tallas disponibles
                widget: select
                multiple: true
                required: false
                options: [XS, S, M, L, XL, XXL, "36", "38", "40", "42", "44", "46", "38-41", "42-45", "Única"]
              - { name: fotoMedidas, label: "📏 Foto de medidas de ESTA prenda (hazla en lobodelujo.pages.dev/admin/medidas). En la ficha sale el botón Ver medidas; no se mezcla con tus fotos", widget: image, required: false, choose_url: false }
              - { name: colores, label: "Colores (separados por coma, ej: Negro, Blanco)", widget: list, required: false }
              - name: fotos
                label: Fotos (la primera es la portada)
                label_singular: foto
                widget: list
                min: 1
                field: { name: foto, label: Foto, widget: image, choose_url: false }

      - name: tienda
        label: "⚙️ Datos de la tienda"
        file: datos/tienda.json
        fields:
          - { name: nombre, label: "Nombre de la tienda", widget: string }
          - name: whatsapp
            label: Números de WhatsApp
            label_singular: número
            widget: list
            summary: "{{fields.nombre}} · {{fields.numero}}"
            fields:
              - { name: nombre, label: "Nombre que ve el cliente (ej: Ventas)", widget: string }
              - { name: numero, label: "Número con 56, sin + ni espacios (ej: 56912345678)", widget: string, pattern: ['^56\d{9}$', "Debe ser 56 + 9 dígitos, sin espacios"] }
          - { name: instagram, label: "Link de Instagram", widget: string }
          - { name: frase, label: "Palabra grande de la portada", widget: string }
          - { name: fraseAbajo, label: "Línea pequeña debajo", widget: string, required: false }
          - { name: envio, label: "Texto de la barra amarilla", widget: string }
          - { name: videoPortada, label: "🎬 Video de portada · computador (MP4 horizontal, máximo 10 MB)", widget: file, required: false, choose_url: false }
          - { name: videoPortadaMovil, label: "📱 Video de portada · celular (MP4 vertical, opcional)", widget: file, required: false, choose_url: false }
          - { name: videoPoster, label: "🖼️ Imagen que se ve mientras carga el video (opcional)", widget: image, required: false, choose_url: false }
          - name: portadasCategorias
            label: "📸 Foto grande de cada categoría (si no subes una, se usa la del primer producto)"
            label_singular: foto de categoría
            widget: list
            required: false
            collapsed: true
            # Igual que en Productos: lo que va entre ⟪ ⟫ se cambia por la miniatura de la foto grande
            summary: "{{fields.categoria}} ⟪{{fields.foto}}⟫"
            fields:
              - name: categoria
                label: Categoría
                widget: select
                options: [Poleras, Polerones, Pantalones, Shorts, Gorras, Lentes, Accesorios]
              - { name: foto, label: "Foto grande (horizontal, ideal 1920×1080)", widget: image, choose_url: false }
              - { name: fotoMovil, label: "Foto para celular (vertical 1080×1350, opcional)", widget: image, required: false, choose_url: false }
          - { name: categorias, label: "Orden de las categorías (separadas por coma)", widget: list }
