<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Panel · Lobo de Lujo</title>
  <link rel="icon" type="image/png" href="../img/logo-lobo-128.png">
</head>
<body>
  <!-- Cada foto que se sube:
       1) recibe un nombre único (fecha + hora), para que los 1.jpg, 2.jpg… de Canva de una prenda
          no choquen con los de otra ni pisen sus fotos
       2) se achica y se le baja el peso (máx. 1800 px por lado, JPG al 82%), para que el catálogo cargue
          rápido en el teléfono sin que se note la diferencia. Las fotos que ya son livianas quedan igual,
          los PNG con fondo transparente siguen siendo PNG y los videos solo se renombran. -->
  <script>
    (function () {
      var LADO_MAX = 1800, CALIDAD = 0.82, YA_LIVIANA = 250 * 1024;
      var limpiar = function (s) {
        return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
          .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      };
      var dos = function (n) { return String(n).padStart(2, "0"); };
      var sello = function () {
        var d = new Date();
        return "" + d.getFullYear() + dos(d.getMonth() + 1) + dos(d.getDate()) + "-" +
          dos(d.getHours()) + dos(d.getMinutes()) + dos(d.getSeconds()) + "-" +
          Math.random().toString(36).slice(2, 5);
      };
      var cargar = function (f) {
        return new Promise(function (ok, mal) {
          var img = new Image(), url = URL.createObjectURL(f);
          img.onload = function () { URL.revokeObjectURL(url); ok(img); };
          img.onerror = function () { URL.revokeObjectURL(url); mal(new Error("No se pudo leer la foto")); };
          img.src = url;
        });
      };
      var tieneTransparencia = function (ctx, w, h) {
        var d = ctx.getImageData(0, 0, w, h).data;
        for (var i = 3; i < d.length; i += 4) if (d[i] < 250) return true;
        return false;
      };
      // Devuelve la foto optimizada, o la original renombrada si ya era liviana, no es foto o algo falla
      var optimizar = function (f, base, ext) {
        var original = new File([f], base + ext, { type: f.type, lastModified: f.lastModified });
        if (!/^image\/(jpeg|png|webp)$/.test(f.type)) return Promise.resolve(original);
        return cargar(f).then(function (img) {
          var lado = Math.max(img.naturalWidth, img.naturalHeight);
          if (f.size <= YA_LIVIANA && lado <= LADO_MAX) return original;
          var k = Math.min(1, LADO_MAX / lado);
          var w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
          var lienzo = document.createElement("canvas");
          lienzo.width = w;
          lienzo.height = h;
          var ctx = lienzo.getContext("2d");
          ctx.imageSmoothingQuality = "high";
          ctx.drawImage(img, 0, 0, w, h);
          var transparente = f.type !== "image/jpeg" && tieneTransparencia(ctx, w, h);
          if (!transparente) {
            ctx.globalCompositeOperation = "destination-over";
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, w, h);
          }
          return new Promise(function (ok) { lienzo.toBlob(ok, transparente ? "image/png" : "image/jpeg", CALIDAD); })
            .then(function (b) {
              if (!b || b.size >= f.size) return original;
              return new File([b], base + (transparente ? ".png" : ".jpg"), { type: b.type, lastModified: f.lastModified });
            });
        }).catch(function () { return original; });
      };
      var aviso = null;
      var mostrarAviso = function (si) {
        if (!aviso) {
          aviso = document.createElement("div");
          aviso.textContent = "Optimizando fotos…";
          aviso.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99999;" +
            "padding:10px 18px;border-radius:999px;background:#111;color:#fad02c;font:600 14px system-ui,sans-serif;" +
            "box-shadow:0 6px 20px rgba(0,0,0,.35)";
        }
        if (si) document.body.appendChild(aviso);
        else if (aviso.parentNode) aviso.parentNode.removeChild(aviso);
      };
      // Se ejecuta antes que el panel (fase de captura): el panel recibe las fotos recién cuando están listas
      window.addEventListener("change", function (e) {
        var input = e.target;
        if (e.loboListo || !(input instanceof HTMLInputElement) || input.type !== "file" || !input.files || !input.files.length) return;
        e.stopImmediatePropagation();
        var s = sello();
        mostrarAviso(true);
        Promise.all(Array.prototype.map.call(input.files, function (f) {
          var punto = f.name.lastIndexOf(".");
          var base = s + "-" + (limpiar(punto > 0 ? f.name.slice(0, punto) : f.name) || "foto");
          return optimizar(f, base, punto > 0 ? f.name.slice(punto).toLowerCase() : "");
        })).then(function (listos) {
          var dt = new DataTransfer();
          listos.forEach(function (f) { dt.items.add(f); });
          input.files = dt.files;
          mostrarAviso(false);
          var ev = new Event("change", { bubbles: true });
          ev.loboListo = true;
          input.dispatchEvent(ev);
        });
      }, true);
    })();
  </script>

  <!-- En la lista de productos, al lado de cada nombre va su foto de portada (la foto 1), para reconocer
       la prenda sin abrirla. El resumen de config.yml trae las fotos entre ⟪ ⟫: aquí se saca ese texto
       y en su lugar se pone la miniatura. -->
  <style>
    .lobo-mini { display: inline-block; width: 56px; height: 70px; margin-right: 12px; border-radius: 6px;
      object-fit: cover; vertical-align: middle; background: #e8e6e1; }
  </style>
  <script>
    (function () {
      // ⟪ y ⟫ escritos con su código, para que este mismo script no cuente como texto con marca
      var MARCA = /\s*⟪([\s\S]*?)⟫/;
      var revisar = function () {
        var andador = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
          acceptNode: function (n) {
            var tag = n.parentNode && n.parentNode.nodeName;
            if (tag === "SCRIPT" || tag === "STYLE" || tag === "TEXTAREA") return NodeFilter.FILTER_SKIP;
            return n.nodeValue.indexOf("⟪") >= 0 ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
          }
        });
        var nodos = [];
        while (andador.nextNode()) nodos.push(andador.currentNode);
        nodos.forEach(function (n) {
          var m = n.nodeValue.match(MARCA);
          if (!m) return;
          n.nodeValue = n.nodeValue.replace(MARCA, "");
          var ruta = (m[1].match(/[^"\[\],\s]+\.(?:jpe?g|png|webp|gif)/i) || [""])[0];
          var src = !ruta || /^(https?:)?\//.test(ruta) ? ruta : "/" + ruta;
          var mini = n.previousSibling && n.previousSibling.className === "lobo-mini" ? n.previousSibling : null;
          if (!mini) {
            mini = document.createElement("img");
            mini.className = "lobo-mini";
            mini.alt = "";
            mini.loading = "lazy";
            // Foto recién subida que todavía no está publicada en la web: queda el cuadrito gris
            mini.onerror = function () { this.removeAttribute("src"); };
            n.parentNode.insertBefore(mini, n);
          }
          if (mini.getAttribute("src") !== src) {
            if (src) mini.src = src;
            else mini.removeAttribute("src");
          }
        });
      };
      var pendiente = false;
      new MutationObserver(function () {
        if (pendiente) return;
        pendiente = true;
        setTimeout(function () { pendiente = false; revisar(); }, 60);
      }).observe(document.body, { childList: true, subtree: true, characterData: true });
    })();
  </script>

  <!-- Panel de administración (Decap CMS). La configuración está en config.yml -->
  <script src="https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js"></script>
</body>
</html>
